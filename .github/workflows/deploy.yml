name: Deploy Watchbox Backend

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: develop tests ci
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/watchbox/Bureau/watchbox-code/watchbox-back
            git pull origin main
            systemctl restart watchbox-backend
