name: Claude PR Review

on:
  pull_request:
    # Uniquement les PR qui ciblent main ou develop
    branches: [main, develop]
    # opened / ready_for_review : première review
    # synchronize (nouveau push) : re-review + vérification des corrections
    types: [opened, synchronize, ready_for_review]
    # Ne lance pas de review si la PR ne touche que ces fichiers
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.pkl'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.svg'

# Un nouveau push annule la review en cours de la même PR : la suivante relit
# tout le diff, donc rien n'est perdu.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Ignore les brouillons et les PR des bots (Dependabot, Renovate...)
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      # Le checkout sert à faire des Grep / lire des fichiers du projet.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review par Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Abonnement Pro/Max : token généré avec `claude setup-token`.
          # Attention : consomme les quotas de la personne qui l'a généré.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Ou, avec une clé API à la place :
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            EVENT: ${{ github.event.action }}

            Fais une review de cette pull request du BACKEND de Watchbox
            (FastAPI + SQLAlchemy 2 / psycopg 3 + PostgreSQL + Alembic,
            Python 3.13). Réponds en français.

            ## Ce qu'il faut relire
            - Lis le diff complet de la PR : `gh pr diff ${{ github.event.pull_request.number }}`.
              Ce diff ne contient que les changements de la PR, même si
              `develop` a été mergé dans la branche entre-temps.
            - Si EVENT vaut "synchronize" (nouveau push) :
              1. Lis d'abord tes commentaires précédents :
                 `gh pr view ${{ github.event.pull_request.number }} --comments`
                 et `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`
              2. Vérifie si les problèmes déjà signalés sont corrigés.
              3. Ne reposte pas en inline une remarque déjà faite :
                 mentionne-la seulement dans la synthèse.

            ## Méthode (pour rester économe)
            - Base-toi d'abord sur le diff.
            - N'ouvre un fichier complet que si le diff ne suffit pas à comprendre.
            - Pour vérifier les impacts, utilise Grep pour trouver où le code
              modifié est utilisé, sans lire tout le projet.

            ## Règles de fiabilité
            - Tu ne peux pas exécuter le code. Ne marque un problème "bloquant"
              que si tu peux montrer le chemin exact qui casse (fichier, ligne,
              appel concerné). Sinon, classe-le "à vérifier" et explique ce
              qu'il faudrait tester.
            - N'utilise pas "potentiellement" pour un bloquant.
            - Pour chaque fonction, méthode ou colonne SUPPRIMÉE ou RENOMMÉE,
              cherche avec Grep si elle est encore utilisée dans ce repo
              (y compris dans les interfaces `domain/interfaces/`).
            - Pour chaque ROUTE supprimée, renommée ou dont le format de
              réponse change : tu n'as pas accès au front. Signale-la en
              "à vérifier" en précisant que les appels de watchbox-app
              doivent être mis à jour.
            - Si `database/models.py` change, vérifie la migration Alembic
              (présente, bon `down_revision`, une seule head, `downgrade()`).
            - La dette connue (liste plus bas) n'est pas à signaler, sauf si la
              PR la reproduit dans du code nouveau ou l'aggrave.

            ## Pièges connus de ce projet (à vérifier en priorité)
            - Architecture stricte Router -> Service -> Repository : un router
              n'appelle jamais un repository ni la base directement.
            - Les classes héritent de leur interface `typing.Protocol`
              (`domain/interfaces/...`). Si une méthode est supprimée de la
              classe mais reste dans l'interface, Python appelle la version
              vide de l'interface, qui renvoie `None` : bug silencieux, à
              signaler comme bloquant. Classe et interface doivent rester
              alignées.
            - Base : SQLAlchemy uniquement (`SessionLocal` + tables de
              `database/models.py`). Pas de SQL brut ni de
              `db_config.connect_to_db()` dans du code nouveau.
            - SQLAlchemy : dans un `exists().where(...)` ou une sous-requête,
              les tables du where sont ajoutées automatiquement au FROM. Un
              join par condition `a.x == b.y` est valide : ce n'est pas un bug.
            - `DISTINCT` + `ORDER BY func.random()` : PostgreSQL refuse, le
              DISTINCT doit être dans une sous-requête.
            - Toute modification de `database/models.py` doit avoir une
              migration Alembic : `down_revision` = tête actuelle (une seule
              head, attention après un merge de develop), `downgrade()`
              fonctionnel, jamais de modification d'une migration déjà en prod.
            - Auth : `Depends(check_jwt_token)`, qui renvoie un UUID
              (`str(user_id)` pour comparer). La protection est posée au niveau
              du router dans `api/server.py` ; `country_router` et `user_router`
              ne sont PAS protégés globalement, donc chaque route sensible de
              `userRouter.py` a besoin de son propre `Depends`. Un nouveau
              router doit être inclus avec la dépendance JWT.
            - L'id utilisateur vient du token, jamais du body ou de l'URL sans
              contrôle. Une route qui modifie/supprime une ressource doit
              vérifier qu'elle appartient à l'utilisateur du token.
            - Routes admin (`api/admin/`) : clé `X-Admin-API-Key` via
              `verify_admin_api_key`, erreurs métier via `to_http_exception`.
            - `async def` + code bloquant = serveur bloqué : les repositories
              (SQLAlchemy sync) et `utils/tmdb_service.py` (`requests`) sont
              synchrones. Un nouveau handler qui les appelle s'écrit en `def`.
            - Appels TMDB/Watchmode multiples en parallèle
              (`ThreadPoolExecutor`), jamais en séquence.
            - Contenu adulte : `movie.adult` est nullable, filtrer avec
              `(Movie.adult == False) | (Movie.adult == None)`, jamais
              `== False` seul.
            - Erreurs : pas de nouveau `except Exception: print(e); return []`
              (l'erreur disparaît). Un `except Exception` autour d'un code qui
              lève `HTTPException` la transforme (400 -> 500) : ajouter
              `except HTTPException: raise` avant. Doublon = HTTP 409.
            - ML : modèle chargé une fois via `get_ml()` / `refresh_ml()`
              (`service/ml_state.py`), jamais `MLService.load` par requête.
              Entraînement jamais synchrone dans un handler :
              `background_tasks.add_task(...)`. Pas de boucle sur
              `predict_svd` : utiliser `predict_svd_batch`.
            - Quiz : génération en `threading.Thread`, pas `BackgroundTasks`
              (qui ne s'exécutent pas si la route lève une HTTPException).
              Pas de filtre `popularity > N`, pas d'accès base dans
              `quizRouter.py`.
            - CORS (`api/server.py`) : `origins` doit contenir toutes les
              origines, sans `None`, sans être écrasée.
            - Toute nouvelle variable d'environnement doit être ajoutée dans
              `.env.example`. Aucun secret commité.

            ## Dette connue (ne pas signaler si la PR n'y touche pas)
            - `repository/recommentation_repository.py` est encore en SQL brut
              (migration SQLAlchemy revertée) : ne pas exiger sa réécriture.
            - `reviewRouter.py` / `swipeRouter.py` appellent
              `ReviewRepository.increment_counter()` directement.
            - La plupart des handlers existants sont en `async def`.
            - `POST /reviews` fait confiance à `review.userId` du body ;
              `playlistRouter` ne vérifie pas le propriétaire ;
              `GET /users/profile/{user_id}` n'est pas protégé.
            - Bug CORS : la 2e affectation de `origins` écrase la 1re.
            - `.env.example` incomplet.

            ## Points à vérifier
            - les pièges connus ci-dessus (en priorité)
            - les bugs et erreurs de logique
            - la sécurité (auth, id utilisateur venant du token, contrôle du
              propriétaire d'une ressource, secrets)
            - la performance (requêtes N+1, produits cartésiens, appels TMDB
              séquentiels, code bloquant dans un `async def`)
            - les autres endroits du projet qui utilisent le code modifié

            ## Format de réponse
            - Commentaires inline uniquement sur les vrais problèmes, avec la
              correction proposée.
            - Pas de commentaire sur ce qui est correct, pas de compliments,
              pas de remarques de style mineures.
            - Termine par UNE synthèse courte, qui commence exactement par
              "## Synthèse Claude" :
              - verdict (OK / à corriger)
              - les bloquants (prouvés) puis les "à vérifier"
              - les migrations à lancer en prod si la PR en contient
              - les nouvelles variables d'environnement à configurer en prod
              - pour un nouveau push : ce qui a été corrigé et ce qui reste à corriger
            - Publie-la en mettant à jour ta synthèse précédente au lieu d'en
              créer une nouvelle :
              `gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "<synthèse>"`

          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*),Grep,Glob,Read"